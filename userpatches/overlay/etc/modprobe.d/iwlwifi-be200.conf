# Intel BE200 (gl-c0-fm-c0) stability option for this sensor image.
#
# Without it the firmware raises ADVANCED_SYSASSERT microcode errors and resets
# the device during iw scan and association. A reset is easy to mistake for a
# measurement: RSSI appears to slide and the negotiated NSS appears to fall from
# 2 to 1, because the radio restarted underneath the reading. Monitor captures
# also fill with corrupt frames that still parse as beacons, inventing hundreds
# of phantom BSSIDs.
#
# Measured on a NanoPi Zero2 + BE200, Armbian 6.1.115-vendor-rk35xx,
# backport-iwlwifi release/core98, firmware 101.6ef20b19.0:
#
#   defaults            monitor bad-FCS 78%; 6 GHz association asserts every time
#   bt_coex_active=0    monitor bad-FCS 0%; 0 crashes across every test below
#
# Verified: 60 s monitor capture = 2879 frames, 0% bad FCS, 0 crashes; 8x full
# scan = 0 crashes; 3x 5 GHz association = 3/3, 0 crashes; 3x 6 GHz association
# = 3/3, 0 crashes. EHT and 320 MHz remain advertised.
#
# Wi-Fi 7 is deliberately LEFT ENABLED. disable_11be=1 was tried and is neither
# necessary nor sufficient: on its own 6 GHz association still asserted, and it
# only reduced bad-FCS to 21% where disabling BT coex reaches 0%. Disabling EHT
# on an EHT sensor also costs 320 MHz capture. Do not re-add it.
#
# Also tried and rejected: amsdu_size=4 and iwlmld power_scheme=1 both broke
# association outright.
#
# KNOWN LIMITATION: sustained throughput (iperf3) can still assert.
options iwlwifi bt_coex_active=0
