# Intel BE200 (gl-c0-fm-c0) stability options for this sensor image.
#
# Without these the firmware raises ADVANCED_SYSASSERT microcode errors and
# resets the device mid-operation. A reset is easy to misread as a measurement:
# RSSI appears to slide and the negotiated NSS appears to drop from 2 to 1,
# because the radio restarted underneath the reading.
#
# Measured on a NanoPi Zero2 + BE200, Armbian 6.1.115-vendor-rk35xx,
# backport-iwlwifi release/core98, firmware 101.6ef20b19.0:
#
#   disable_11be=1    monitor-mode bad-FCS rate 78% -> ~21%; monitor capture,
#                     channel hopping and 5 GHz association become stable.
#   bt_coex_active=0  stops the assert on 6 GHz association, which was
#                     otherwise reproducible on every attempt.
#
# Verified after: 4 min of monitor hopping across 2.4/5/6 GHz = 8049 frames,
# 0 crashes; 10x full scan, 10x targeted scan, 5x association = 0 crashes.
#
# KNOWN LIMITATION: sustained throughput (iperf3) can still assert. This makes
# the device dependable for scanning and capture, which is what the sensor
# image is for, but treat long high-rate transfers as unproven.
#
# Tried and rejected: amsdu_size=4 and iwlmld power_scheme=1 both broke
# association outright. Do not re-add without retesting.
options iwlwifi disable_11be=1 bt_coex_active=0
